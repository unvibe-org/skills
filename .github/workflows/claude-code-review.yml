name: Claude Code Review

on:
  pull_request:
    # `ready_for_review` is what un-drafting a pull request fires. Without it, a
    # pull request opened as a draft would never get its first review, because
    # the draft skip below swallows `opened`.
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # This repository is public. Runs for a pull request from a fork or from a
    # bot cannot see the Actions secrets, so CLAUDE_CODE_OAUTH_TOKEN would be
    # empty and the job would fail on someone else's pull request. Skip those;
    # a maintainer can still ask for a review with an `@claude` comment.
    # Drafts are skipped because every push would buy another full review of
    # work still in progress. A skipped job reports neutral.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Record start time
        id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Agent skills, not application code. The review rules live in
          # REVIEW.md at the repo root; this prompt only points the agent there.
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

            Read REVIEW.md at the repository root and review this pull request
            exactly as it instructs. It defines severity, what to check, what to
            skip, the verification bar, and the summary shape. This repository
            publishes agent skills as Claude Code plugins, so most changes are
            instructions for an agent, plugin metadata, and the README.

            Steps:
            1. Run `gh pr diff ${{ github.event.pull_request.number }}` to get the diff
               and `gh pr view ${{ github.event.pull_request.number }}` for the description.
            2. Read REVIEW.md, then AGENTS.md, and the files it names as canonical
               for each check (the changed plugin's plugin.json, SKILL.md and
               references, .claude-plugin/marketplace.json, README.md).
            3. Post each Important finding and each nit as an inline comment on the
               changed line, prefixed with "Important:" or "Nit:", quoting the rule or
               conflicting file as REVIEW.md requires.
            4. Write the summary in the shape REVIEW.md specifies to
               `review-summary.md` with the Write tool, then post it with
               `gh pr comment ${{ github.event.pull_request.number }} --body-file review-summary.md`.
               Never pass the body inline or through command substitution; the
               tool permissions deny that. Post the summary even when you found
               nothing; it is then just the verdict line, the commit line, and
               the marker.
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # --model pins the reviewer so it doesn't drift with the action's default.
          # Opus 5, not 5.5: 5.5 needs Claude Code >= 2.1.280 and the v1 release
          # may still install an older one (API error claude_code_version_too_old).
          claude_args: |
            --model claude-opus-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob,Write"

      # The action above exits green whenever the agent finishes, whatever it
      # found, and also when a tool-permission denial kept it from posting.
      # Read the verdict out of the summary comment this run posted and fail
      # the job unless the pull request is mergeable as it stands. Only open
      # Important items block a merge; nits never do.
      - name: Fail on the review verdict
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SINCE: ${{ steps.start.outputs.at }}
          WORKFLOW: .github/workflows/claude-code-review.yml
        run: |
          # claude-code-action refuses to run when this workflow file differs
          # from the copy on the default branch, so a pull request that edits
          # the file gets no review and no summary comment. That is the action
          # working as designed, not a finding: warn and pass. The change gets
          # reviewed on the run that follows the merge.
          default_branch=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)
          base_blob=$(gh api "repos/${GITHUB_REPOSITORY}/contents/${WORKFLOW}?ref=${default_branch}" \
            --jq .sha 2>/dev/null || echo "")
          head_blob=$(git hash-object "$WORKFLOW" 2>/dev/null || echo "")
          if [ "$base_blob" != "$head_blob" ]; then
            echo "::warning::This pull request changes ${WORKFLOW}, so the review action skipped itself. No verdict to gate on."
            exit 0
          fi

          body=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments?since=${SINCE}&per_page=100" \
            --jq '[.[] | select(.user.login == "claude[bot]" or .user.login == "github-actions[bot]")] | last | .body // ""' \
            | tr -d '\r')

          if [ -z "$(printf '%s' "$body" | tr -d '[:space:]')" ]; then
            echo "::error::No review summary was posted on PR #${PR}. Check the 'Run Claude Code Review' step for tool-permission denials or run errors."
            exit 1
          fi

          verdict=$(printf '%s\n' "$body" \
            | sed -n 's/.*<!--[[:space:]]*review-verdict:[[:space:]]*\([a-z-]*\)[[:space:]]*-->.*/\1/p' \
            | tail -n 1)

          echo "verdict: ${verdict:-<none>}"
          case "$verdict" in
            mergeable)     exit 0 ;;
            important)     echo "Important items open"; exit 1 ;;
            not-mergeable) echo "not mergeable"; exit 1 ;;
            "")            echo "::error::The summary has no review-verdict marker, so it is not in REVIEW.md shape."; exit 1 ;;
            *)             echo "unknown verdict: $verdict"; exit 1 ;;
          esac
